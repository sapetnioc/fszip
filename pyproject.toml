[project]
name = "fszip"
version = "1.0.0"

[project.entry-points."fsspec.specs"]
fszip = "fszip:ZipAwareFileSystem"

[tool.setuptools.packages.find]
include = ["fszip"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"
]
[tool.pixi.dependencies]
fsspec = ">=2026.9.0,<2027"

[tool.pixi.pypi-dependencies]
fszip = { path = ".", editable = true }
